[package]
name = "firebae-cm"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Thomas Veldman <apps@thomasveldman.nl>"]
description = "A Firebase Cloud Messaging Http V1 implementation"
license = "MIT"
homepage = "https://github.com/Vesafary/firebae-cm"
repository = "https://github.com/Vesafary/firebae-cm"
keywords = ["web", "firebase"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"

[dependencies]
# NOTE: the `path` entry is for local development. firebae-derive 0.2.0 must be
# published to crates.io before firebae-cm 0.5.0 can be released.
firebae-derive =    { version = "0.2.0", path = "../firebae-derive" }
serde =             { version = "1.0.229", features = ["derive"] }
serde_json =        { version = "1.0.151" }
reqwest =           { version = "0.13.4", features = ["json", "rustls"], default-features = false }
time =              { version = "0.3.55", features = ["formatting"] }
thiserror =         { version = "2.0.19" }
futures-util =      { version = "0.3.31", default-features = false, features = ["std"] }
gcp_auth =          { version = "0.12.7", optional = true }
tokio =             { version = "1.53.1", features = ["sync", "parking_lot"], default-features = false, optional = true }

[dev-dependencies]
serde_json =        { version = "1.0.151" }
tokio =             { version = "1.53.1", features = ["macros", "rt"] }

[features]
oauth = ["dep:gcp_auth", "dep:tokio"]


# docs.rs-specific configuration
[package.metadata.docs.rs]
# document all features
all-features = true
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]
